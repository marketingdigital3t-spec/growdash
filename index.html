    <meta name="apple-mobile-web-app-title" content="Growdash" />

    <meta name="twitter:image:alt" content="Logo Growdash" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"Growdash","url":"https://growdash.com.br/","logo":"https://growdash.com.br/growdash-logo-full-light.png"}
    </script>
    <script>
      (function() {
        try {
          // Plataforma 100% Esmeralda Neon pura. Sem roxo, sem obsidian.
          var platform = 'emerald';
          try { localStorage.setItem('growdash:accent-theme', 'emerald'); } catch(e) {}
          // Purga preventiva: localStorage cheio estoura QuotaExceededError e
          // derruba o React inteiro no primeiro setItem. Libera espaco antes
          // de qualquer modulo escrever no storage.
          try {
            var bytes = 0;
            for (var k in localStorage) {
              if (Object.prototype.hasOwnProperty.call(localStorage, k)) bytes += (localStorage[k] || '').length * 2;
            }
            if (bytes > 3 * 1024 * 1024) {
              var discardable = ['growdash:rd-', 'growdash:last-', 'growdash:runtime-diagnostics', 'growdash:runtime-recovery', 'cache'];
              for (var i = localStorage.length - 1; i >= 0; i--) {
                var key = localStorage.key(i);
                if (!key) continue;
                for (var d = 0; d < discardable.length; d++) {
                  if (key.indexOf(discardable[d]) !== -1) { localStorage.removeItem(key); break; }
                }
              }
            }
          } catch (e) {}
          var storedMode = localStorage.getItem('theme');
          var mode = storedMode === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.dataset.accent = 'emerald';
          root.dataset.platformTheme = 'emerald';
          root.classList.add('gd-premium');
          if (mode === 'dark') root.classList.add('dark');
          else root.classList.remove('dark');
          root.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:grid;min-height:100vh;place-items:center;background:#0B0D10;color:#F5F7FA;font:700 14px Inter,system-ui,sans-serif;letter-spacing:.08em">
        <div style="display:grid;gap:13px;justify-items:center;text-align:center"><span style="width:28px;height:28px;border:2px solid #494949;border-top-color:#fff;border-radius:999px;animation:growdash-spin .7s linear infinite"></span><span>Carregando Growdash…</span></div>
      </div>
    </div>
    <script src="/growdash-boot.js" defer></script>
    <style>@keyframes growdash-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
