<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./growdash-mark-gold.svg" />
    <meta name="theme-color" content="#070503" />
    <title>Growdash | Growth Intelligence</title>
    <meta name="description" content="Growdash: inteligência de growth, mídia, CRM e operação em um só lugar." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Growdash" />
    <meta property="og:description" content="Inteligência de growth, mídia, CRM e operação em um só lugar." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Growdash" />
    <meta name="twitter:description" content="Inteligência de growth, mídia, CRM e operação em um só lugar." />
  </head>
  <body>
    <div id="root">
      <div style="display:grid;min-height:100vh;place-items:center;background:#070503;color:#f6c94a;font:700 14px Nunito,system-ui,sans-serif;letter-spacing:.08em">
        Carregando Growdash…
      </div>
    </div>
    <script>
      // Keep a broken/blocked entry module from leaving Safari on a permanent
      // blank loading screen. main.tsx marks the boot as soon as React starts.
      window.setTimeout(function () {
        if (window.__GROWDASH_BOOTED__) return;
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML = '<div style="display:grid;min-height:100vh;place-items:center;background:#070503;color:#f6c94a;font:600 15px Nunito,system-ui,sans-serif;text-align:center;padding:24px"><div><p style="font-weight:800">A Growdash não conseguiu iniciar.</p><p style="opacity:.72;margin-top:8px">A conexão ou um bloqueador interrompeu o carregamento.</p><button type="button" onclick="location.reload()" style="margin-top:16px;border:0;border-radius:10px;background:#f6c94a;color:#070503;padding:10px 16px;font-weight:800;cursor:pointer">Recarregar</button></div></div>';
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
