<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Growdash · Meta Ads</title>
    <style>
      body{margin:0;background:#090909;color:#f5f5f5;font:16px system-ui;display:grid;min-height:100vh;place-items:center;padding:24px;box-sizing:border-box}
      main{max-width:520px;border:1px solid #5c4816;border-radius:18px;background:#15130e;padding:32px;text-align:center;box-shadow:0 20px 60px #0008}
      h1{font-size:24px} h1.success{color:#f5f5f5} h1.error{color:#ff6b6b}
      p{color:#c8c8c8;line-height:1.55} button{border:1px solid #f5f5f5;border-radius:10px;background:#f5f5f5;color:#101010;padding:12px 18px;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="message"></p>
      <button type="button" onclick="window.close()">Voltar para a Growdash</button>
    </main>
    <script src="/meta-oauth-callback.js" defer></script>
  </body>
</html>
